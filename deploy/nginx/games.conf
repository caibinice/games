    # begin-games-static-app
    # Existing cockpit Java process; only this exact endpoint upgrades to WebSocket.
    location = /smartCockpit/api/games/ws {
        proxy_pass http://127.0.0.1:8080/api/games/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }
    location = /games { return 301 /games/$is_args$args; }
    location ^~ /games/ {
        root /opt/games/www;
        index index.html;
        try_files $uri $uri/ =404;
        gzip_static on;
        types {
            text/html html;
            text/css css;
            application/javascript js mjs;
            application/json json;
            application/manifest+json webmanifest;
            image/svg+xml svg;
            image/webp webp;
            image/png png;
            image/jpeg jpg jpeg;
            model/gltf-binary glb;
            model/gltf+json gltf;
            audio/mpeg mp3;
            audio/ogg ogg;
            audio/wav wav;
            font/woff2 woff2;
            text/plain txt;
        }
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), fullscreen=(self), accelerometer=(self), gyroscope=(self)" always;
    }
    # end-games-static-app
